te 2s}.wave-line{stroke-dasharray:8 12;animation:waveDash 14s linear infinite}.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:44px;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:19px;fill:#cbd5e1;letter-spacing:.3px}.card-label,.card-value,.pill-text,.subtitle-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.pill-text{font-size:13px;font-weight:600;fill:#e0e7ff;letter-spacing:.5px}.card-label{font-size:12px;font-weight:500;fill:#94a3b8}.card-value{font-size:15px;font-weight:700;fill:#f8fafc}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g opacity=".8"><circle cx="220" cy="90" r="140" fill="#38bdf8" class="pulse-glow-1" filter="url(#blurFilter)"/><circle cx="980" cy="250" r="160" fill="#a855f7" class="pulse-glow-2" filter="url(#blurFilter)"/><circle cx="600" cy="180" r="260" fill="url(#centerGlow)"/></g><g opacity=".25"><path fill="none" stroke="#60a5fa" stroke-width="2" d="M -50 100 Q 300 240 600 120 T 1250 200" class="wave-line"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M -50 260 Q 350 90 700 230 T 1250 140" class="wave-line"/></g><g class="card-float-1" transform="translate(48, 80)"><rect width="180" height="74" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1.5" rx="12"/><circle cx="28" cy="37" r="14" fill="#38bdf8" fill-opacity=".2"/><text x="28" y="42" font-size="14" text-anchor="middle">💬</text><text x="52" y="30" class="card-label">SLA Status</text><text x="52" y="52" class="card-value">99.8% On-Time</text></g><g class="card-float-3" transform="translate(68, 205)"><rect width="190" height="74" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1.5" rx="12"/><circle cx="28" cy="37" r="14" fill="#34d399" fill-opacity=".2"/><text x="28" y="42" font-size="14" text-anchor="middle">🚀</text><text x="52" y="30" class="card-label">Auto-Triage</text><text x="5