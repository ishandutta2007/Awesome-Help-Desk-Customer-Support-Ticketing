<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant primary glow gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge pill gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25" />
    </linearGradient>

    <!-- Subtle radial glow behind text -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Pulse glow circles in background */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.15); }
    }
    .pulse-glow-1 {
      transform-origin: 200px 100px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .pulse-glow-2 {
      transform-origin: 1000px 240px;
      animation: pulseGlow 9s ease-in-out infinite alternate;
    }

    /* Subtle floating animation for background badges */
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(2deg); }
      50% { transform: translateY(-14px) rotate(-1deg); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite 1s; }
    .card-float-3 { animation: floatCard3 6.5s ease-in-out infinite 2s; }

    /* Animated signal wave lines */
    @keyframes waveDash {
      to { stroke-dashoffset: -200; }
    }
    .wave-line {
      stroke-dasharray: 8 12;
      animation: waveDash 14s linear infinite;
    }

    /* Font styling */
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #cbd5e1;
      letter-spacing: 0.3px;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e0e7ff;
      letter-spacing: 0.5px;
    }
    .card-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .card-value {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #f8fafc;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient background glow spots (strictly in background) -->
  <g opacity="0.8">
    <circle class="pulse-glow-1" cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#blurFilter)" />
    <circle class="pulse-glow-2" cx="980" cy="250" r="160" fill="#a855f7" filter="url(#blurFilter)" />
    <circle cx="600" cy="180" r="260" fill="url(#centerGlow)" />
  </g>

  <!-- Background Floating Network Lines (Strictly behind cards & text) -->
  <g opacity="0.25">
    <path class="wave-line" d="M -50 100 Q 300 240 600 120 T 1250 200" fill="none" stroke="#60a5fa" stroke-width="2" />
    <path class="wave-line" d="M -50 260 Q 350 90 700 230 T 1250 140" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Dynamic Decorative Visual Elements (Positioned out of the way on sides) -->
  <!-- Left Decorative Float: Omnichannel Support Status -->
  <g class="card-float-1" transform="translate(48, 80)">
    <rect width="180" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="37" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <text x="28" y="42" text-anchor="middle" font-size="14">💬</text>
    <text class="card-label" x="52" y="30">SLA Status</text>
    <text class="card-value" x="52" y="52">99.8% On-Time</text>
  </g>

  <g class="card-float-3" transform="translate(68, 205)">
    <rect width="190" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="37" r="14" fill="#34d399" fill-opacity="0.2" />
    <text x="28" y="42" text-anchor="middle" font-size="14">🚀</text>
    <text class="card-label" x="52" y="30">Auto-Triage</text>
    <text class="card-value" x="52" y="52">AI Routing Active</text>
  </g>

  <!-- Right Decorative Float: Open Source & Security Metrics -->
  <g class="card-float-2" transform="translate(965, 80)">
    <rect width="185" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="37" r="14" fill="#818cf8" fill-opacity="0.2" />
    <text x="28" y="42" text-anchor="middle" font-size="14">⭐</text>
    <text class="card-label" x="52" y="30">Open-Source</text>
    <text class="card-value" x="52" y="52">Self-Hosted Hub</text>
  </g>

  <g class="card-float-1" transform="translate(945, 205)">
    <rect width="195" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="37" r="14" fill="#f472b6" fill-opacity="0.2" />
    <text x="28" y="42" text-anchor="middle" font-size="14">🛡️</text>
    <text class="card-label" x="52" y="30">Data Privacy</text>
    <text class="card-value" x="52" y="52">GDPR &amp; Self-Host</text>
  </g>

  <!-- FOREGROUND: Pill Tag, Title, Subtitle, & Tech Badges (Always in foreground, never obscured) -->
  <!-- Top Category Pill Tag -->
  <g transform="translate(450, 42)">
    <rect width="300" height="32" rx="16" fill="url(#pillGrad)" stroke="#6366f1" stroke-width="1.2" />
    <text class="pill-text" x="150" y="21" text-anchor="middle">⚡ CURATED PLATFORMS &amp; ENGINES</text>
  </g>

  <!-- Main Hero Title with Gradient Fill -->
  <text class="title-text" x="600" y="130" text-anchor="middle" fill="url(#primaryGrad)">
    Awesome Help Desk &amp; Ticketing
  </text>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="172" text-anchor="middle">
    Top Customer Support, Shared Inboxes &amp; Open-Source Ticketing Systems
  </text>

  <!-- Secondary Highlights Pills Bar (Foreground) -->
  <g transform="translate(300, 218)">
    <!-- Pill 1: SaaS Leaders -->
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text class="pill-text" x="90" y="22" text-anchor="middle" fill="#93c5fd">☁️ Enterprise SaaS</text>

    <!-- Pill 2: Open Source -->
    <rect x="195" y="0" width="190" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text class="pill-text" x="290" y="22" text-anchor="middle" fill="#6ee7b7">🔓 100% Self-Hosted</text>

    <!-- Pill 3: Multichannel -->
    <rect x="400" y="0" width="200" height="34" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text class="pill-text" x="500" y="22" text-anchor="middle" fill="#d8b4fe">🌐 Omnichannel Support</text>
  </g>

  <!-- Subtle bottom border glow -->
  <rect x="250" y="358" width="700" height="2" rx="1" fill="url(#primaryGrad)" opacity="0.6" />
</svg>